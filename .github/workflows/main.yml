name: Security Scan

on:
  push:
    branches: [ master ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (secrets scan)
        run: gitleaks detect --source . --redact -v --report-path gitleaks-report.json || true
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Run Yarn audit
        run: yarn npm audit --all --recursive | tee yarn-audit-report.txt
        continue-on-error: true

      - name: Run Snyk dependency scan
        run: npx snyk test --severity-threshold=low | tee snyk-dependency-report.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Run Snyk Code scan
        run: npx snyk code test --severity-threshold=low | tee snyk-code-report.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            yarn-audit-report.txt
            snyk-dependency-report.txt
            snyk-code-report.txt
          retention-days: 5
